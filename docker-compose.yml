services:
  devspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspaces/clearwave:cached
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    container_name: clearwave-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  worker-merchant-a:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: clearwave-worker-merchant-a
    command: ["merchant-a"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLEARWAVE_GROUND_TRUTH_DB: /hidden-truth/ground_truth.db
    volumes:
      - ./state/ground_truth/merchant-a:/hidden-truth
    restart: unless-stopped

  worker-merchant-b:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: clearwave-worker-merchant-b
    command: ["merchant-b"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLEARWAVE_GROUND_TRUTH_DB: /hidden-truth/ground_truth.db
    volumes:
      - ./state/ground_truth/merchant-b:/hidden-truth
    restart: unless-stopped

  worker-merchant-c:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: clearwave-worker-merchant-c
    command: ["merchant-c"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLEARWAVE_GROUND_TRUTH_DB: /hidden-truth/ground_truth.db
    volumes:
      - ./state/ground_truth/merchant-c:/hidden-truth
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    hostname: schema-registry
    container_name: clearwave-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    container_name: clearwave-detector
    user: "1000:1000"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CLEARWAVE_DB: /data/clearwave.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./state:/data
    # ./state:/data would otherwise hand this container /data/ground_truth,
    # raul's hidden truth, which docs/ownership.md quarantines from W2. An
    # empty tmpfs mounted over that subpath masks it: the process sees a
    # directory with nothing in it and has no read path to C6 at all.
    tmpfs:
      - /data/ground_truth
    restart: unless-stopped

  investigation:
    build:
      context: .
      dockerfile: investigation/Dockerfile
    container_name: clearwave-investigation
    user: "1000:1000"
    environment:
      CLEARWAVE_DB: /data/clearwave.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./state:/data
    restart: unless-stopped

volumes:
  kafka-data:
